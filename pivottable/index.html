<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>PivotTable</title>
    <script src="/grist-plugin-api.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.6.1/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui-touch-punch/0.2.3/jquery.ui.touch-punch.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.16.3/plotly-basic.min.js"></script>

    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/pivottable/2.23.0/pivot.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pivottable/2.23.0/pivot.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pivottable/2.23.0/d3_renderers.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pivottable/2.23.0/plotly_renderers.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pivottable/2.23.0/export_renderers.min.js"></script>
    <style>
      body {
        font-family: Liberation Sans, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji, Segoe UI Symbol;
      }
      .pivot-toolbar {
        margin: 0 0 8px;
      }

      table.pvtTable {
        font-size: 8pt;
        font-family: 'Arial Narrow', sans-serif;
        thead, tbody {
          tr th {
            background-color: transparent;

            border-style: none;
            font-weight: normal;
          }

          tr {
            td, th {
              padding: 3px 5px;
            }
          }
        }

        thead tr th + th.pvtAxisLabel {
          /* Hide the axis header for the columns - generally the columns are self-explanatory (e.g. years).*/
          visibility: hidden;
        }

        .pvtAxisLabel {
          text-align: left;
        }
        .pvtColLabel, .pvtRowTotalLabel {
          vertical-align: bottom;
        }

        thead tr.pvt-title-row th {
          font-weight: bold;
          text-align: left;
          padding: 4px 4px 6px;
          border-bottom-style: none;
        }

        thead tr.pvt-title-row + tr th {
          border-bottom-style: none;

          &.pvtColLabel, &.pvtTotalLabel, &.pvtRowTotalLabel {
            border-bottom-style: solid;
          }
        }

        tbody tr th {
          text-align: left;
        }
        thead tr th {
          border-bottom: 1px solid black;
        }

        .pvtTotalLabel.pvtColTotalLabel, .pvtTotal.colTotal, .pvtGrandTotal {
          border-style: none;
          border-top: 1px solid black;
          border-bottom: 1px solid black;
        }

        td.pvtVal, td.pvtTotal,td.grandTotal {
          border-style: none;
        }
        td.pvtVal:empty:before {
          content: '-';
        }
      }

      .pivot-toolbar button {
        border: 1px solid #888;
        border-radius: 4px;
        background: #f5f5f5;
        color: #222;
        cursor: pointer;
        font: inherit;
        padding: 6px 12px;
      }

      .pivot-toolbar button:disabled {
        cursor: default;
        opacity: 0.55;
      }

      #pivot-title {
        font-size: 14pt;
        font-weight: bold;
        margin: 0 0 6px;
        padding: 2px 4px;
        min-height: 1.4em;
        border-radius: 3px;
        outline: none;
        border: 1px solid transparent;
        cursor: text;
        display: inline-block;
        min-width: 8em;
      }

      #pivot-title:hover,
      #pivot-title:focus {
        border-color: #aaa;
        background: #fafafa;
      }

      #pivot-title[data-readonly]  {
        cursor: default;
      }

      #pivot-title[data-readonly]:hover {
        border-color: transparent;
        background: transparent;
      }

      #pivot-title:empty:before {
        content: attr(data-placeholder);
        color: #aaa;
        font-weight: normal;
        pointer-events: none;
      }

      @media (prefers-color-scheme: dark) {
        #pivot-title:hover,
        #pivot-title:focus {
          background: #3e3e50;
          border-color: #666;
        }
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #32323f;
        }
        .pivot-toolbar button {
          background: #4a4a5a;
          border-color: #6a6a7a;
          color: #fff;
        }
        .pvtUiCell,
        .pvtRenderer,
        .pvtAggregator,
        .pvtAttr,
        .pvtTriangle,
        .pvtFilterBox,
        .pvtFilterBox .count,
        .pvtFilterBox button {
          background-color: #32323f !important;
          color: #FFF;
        }
      }
    </style>
  </head>
  <body>
    <div id="pivot-title" contenteditable="true" data-placeholder="Click to add a title…" spellcheck="false"></div>
    <div class="pivot-toolbar">
      <button id="copyPivotTable" type="button" disabled>Copy table</button>
    </div>
    <div id="table"></div>
    <script src="index.js"></script>
  </body>
</html>
